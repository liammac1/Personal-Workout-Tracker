<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Home Gym Tracker</title>

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Home Gym" />
<meta name="theme-color" content="#131319" />

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23131319'/%3E%3Cline x1='12' y1='50' x2='88' y2='50' stroke='%234b4e5c' stroke-width='6'/%3E%3Crect x='20' y='30' width='9' height='40' rx='3' fill='%23ffc94a'/%3E%3Crect x='71' y='30' width='9' height='40' rx='3' fill='%23ffc94a'/%3E%3Crect x='32' y='38' width='7' height='24' rx='2' fill='%23ffc94a'/%3E%3Crect x='61' y='38' width='7' height='24' rx='2' fill='%23ffc94a'/%3E%3C/svg%3E" />

<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #131319;
    --surface: #1d1e26;
    --surface-alt: #262833;
    --steel: #4b4e5c;
    --steel-light: #6c7080;
    --text-primary: #f1eee6;
    --text-secondary: #94969f;
    --accent: #ffc94a;
    --accent-dim: #9c7d33;
    --rest: #7c8fa6;
    --danger: #eb5757;
    --superset: #8b7fd1;
    --dropset: #ff8a4c;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; padding: 0; background: var(--bg); overscroll-behavior-y: none; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(255,201,74,0.06), transparent 40%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 14px);
    color: var(--text-primary);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .app-root {
    width: 100%;
    max-width: 430px;
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  }

  .header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px 8px; margin-bottom: 18px; }
  .header-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 auto; }
  .header-text .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }

  .title { font-family: 'Bebas Neue', sans-serif; font-size: 40px; letter-spacing: 0.02em; line-height: 1; }

  .header-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; flex: 0 1 auto; }

  .history-btn {
    flex: 0 0 auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 8px 10px;
    border-radius: 9px;
    border: 1px solid rgba(255,255,255,0.1);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
  }

  .barbell-wrap { background: var(--surface); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 14px 12px 10px; margin-bottom: 18px; }
  .barbell-svg { width: 100%; height: 44px; display: block; }
  .barbell-label { text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .barbell-count { color: var(--accent); font-weight: 600; font-size: 14px; }

  .day-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 6px 2px 6px 2px; margin: 0 -2px 16px -2px; scrollbar-width: none; }
  .day-tabs::-webkit-scrollbar { display: none; }

  .day-tab {
    position: relative;
    flex: 0 0 auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.07);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 52px;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .day-tab.today::before {
    content: "";
    position: absolute;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
  }
  .day-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(255,201,74,0.08); }
  .day-tab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--steel); }
  .day-tab.complete .dot { background: var(--accent); }
  .day-tab.restday .dot { background: var(--rest); }

  .card { background: var(--surface); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 18px 16px 8px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 10px; }
  .focus-label { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 0.01em; line-height: 1.1; flex: 1; min-width: 0; }

  .day-title-input {
    flex: 1;
    min-width: 0;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.01em;
    background: var(--surface-alt);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 5px 10px;
    color: var(--text-primary);
    outline: none;
  }
  .day-title-input:focus { border-color: var(--accent); }

  .exercise-info.edit-fields { display: flex; flex-direction: column; gap: 6px; }
  .inline-edit-input {
    background: var(--surface-alt);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 7px;
    padding: 7px 9px;
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    outline: none;
    width: 100%;
  }
  .inline-edit-input.name-input { font-size: 14px; font-weight: 500; }
  .inline-edit-input.target-input { font-size: 12px; font-family: 'IBM Plex Mono', monospace; color: var(--accent-dim); }
  .inline-edit-input:focus { border-color: var(--accent); }
  .card-head-right { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .progress-chip { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent); font-weight: 600; white-space: nowrap; }

  .icon-btn {
    width: 28px; height: 28px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    background: var(--surface-alt); color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; cursor: pointer; flex: 0 0 auto;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .icon-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  .card-sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-secondary); letter-spacing: 0.05em; margin-bottom: 14px; }

  .rest-block { padding: 30px 4px 34px; text-align: center; }
  .rest-icon { font-size: 28px; margin-bottom: 10px; opacity: 0.7; }
  .rest-text { color: var(--text-secondary); font-size: 14px; line-height: 1.5; max-width: 280px; margin: 0 auto; }

  .empty-state { padding: 26px 4px 30px; text-align: center; color: var(--text-secondary); font-size: 13px; line-height: 1.5; }

  .exercise-rows-container { position: relative; }
  .exercise-row-wrap { border-bottom: 1px solid rgba(255,255,255,0.05); transition: transform 0.15s ease; }
  .exercise-row-wrap:last-child { border-bottom: none; }
  .exercise-row-wrap.dragging {
    position: relative;
    z-index: 20;
    background: var(--surface-alt);
    border-radius: 10px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.4);
  }

  .drag-handle {
    flex: 0 0 auto;
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    color: var(--steel-light);
    cursor: grab;
    touch-action: none;
  }
  .drag-handle:active { cursor: grabbing; color: var(--accent); }

  .exercise-row { display: flex; align-items: center; gap: 12px; padding: 13px 2px; }
  .exercise-row.edit-row { cursor: default; }

  .checkbox {
    flex: 0 0 auto; width: 24px; height: 24px; border-radius: 7px;
    border: 2px solid var(--steel-light);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .checkbox.checked { background: var(--accent); border-color: var(--accent); }
  .checkbox svg { width: 14px; height: 14px; }

  .remove-btn {
    flex: 0 0 auto; width: 24px; height: 24px; border-radius: 7px;
    border: 1px solid rgba(235,87,87,0.4);
    background: rgba(235,87,87,0.12); color: var(--danger);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; line-height: 1; cursor: pointer;
  }

  .exercise-info { flex: 1; min-width: 0; cursor: pointer; user-select: none; }
  .exercise-name { font-size: 14.5px; font-weight: 500; transition: color 0.15s ease, opacity 0.15s ease; }
  .exercise-row.done .exercise-name {
    color: var(--text-secondary);
    text-decoration: line-through;
    text-decoration-color: var(--steel-light);
    opacity: 0.75;
  }
  .exercise-target { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--accent-dim); margin-top: 2px; }
  .exercise-row.done .exercise-target { color: var(--steel); }
  .log-summary { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--accent); margin-top: 3px; }

  .expand-chevron { flex: 0 0 auto; color: var(--steel-light); font-size: 11px; padding: 4px; cursor: pointer; user-select: none; }

  .exercise-row-wrap.in-superset { border-left: 3px solid var(--superset); padding-left: 8px; margin-left: -2px; }
  .exercise-row-wrap.in-superset .exercise-row { padding-left: 2px; }
  .superset-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--superset);
    padding: 8px 2px 2px;
  }

  .group-toggle-btn {
    flex: 0 0 auto;
    width: 24px; height: 24px;
    border-radius: 7px;
    border: 1.5px solid var(--steel-light);
    background: transparent;
    color: var(--text-primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
    cursor: pointer;
  }
  .group-toggle-btn.selected { background: var(--superset); border-color: var(--superset); color: #16121f; }
  .group-toggle-btn.labeled { background: rgba(139,127,209,0.15); border-color: var(--superset); color: var(--superset); }

  .group-action-btn { border-color: var(--superset); color: var(--superset); }
  .group-action-btn:active { border-color: var(--superset); }

  .pr-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    color: #1a1200;
    background: var(--accent);
    padding: 2px 6px;
    border-radius: 6px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .dropset-tag {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--dropset);
    background: rgba(255,138,76,0.12);
    padding: 2px 7px;
    border-radius: 6px;
    margin-top: 4px;
  }

  .dropset-toggle-btn {
    flex: 0 0 auto;
    width: 24px; height: 24px;
    border-radius: 7px;
    border: 1.5px solid var(--steel-light);
    background: transparent;
    color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
    font-size: 9.5px; font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
    cursor: pointer;
  }
  .dropset-toggle-btn.active { background: var(--dropset); border-color: var(--dropset); color: #2a1200; }

  .sets-pill.has-dropset { border-color: var(--dropset); }

  .sets-pill {
    flex: 0 0 auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    background: var(--surface-alt);
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .sets-pill.complete { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .sets-pill:active { transform: scale(0.96); }

  .log-panel { display: flex; gap: 10px; padding: 0 2px 14px 40px; }
  .log-field { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .log-field label { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--steel-light); }
  .log-field input {
    background: var(--surface-alt); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
    padding: 8px 10px; color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 13.5px;
    outline: none; width: 100%;
  }
  .log-field input:focus { border-color: var(--accent); }

  .add-exercise-btn {
    width: 100%; margin-top: 8px; padding: 12px; border-radius: 10px;
    border: 1.5px dashed rgba(255,255,255,0.15); background: transparent; color: var(--text-secondary);
    font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; letter-spacing: 0.04em;
    cursor: pointer; text-align: center;
  }
  .add-exercise-btn:active { border-color: var(--accent); color: var(--accent); }

  .add-exercise-form { margin-top: 10px; padding: 12px; background: var(--surface-alt); border-radius: 12px; display: flex; flex-direction: column; gap: 8px; }
  .add-exercise-form input {
    background: var(--bg); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
    padding: 10px 12px; color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 14px;
    outline: none; width: 100%;
  }
  .add-exercise-form input::placeholder { color: var(--steel-light); }
  .add-exercise-form input:focus { border-color: var(--accent); }
  .add-exercise-actions { display: flex; gap: 8px; }
  .form-btn { flex: 1; padding: 10px; border-radius: 8px; border: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; cursor: pointer; }
  .form-btn.primary { background: var(--accent); color: var(--bg); }
  .form-btn.secondary { background: var(--steel); color: var(--text-primary); }
  .form-btn.textcopy {
    width: 100%;
    padding: 13px;
    background: transparent;
    border: 1.5px dashed var(--rest);
    color: var(--rest);
  }
  .textcopy-note {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: var(--steel-light);
    text-transform: none;
  }

  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .history-row {
    display: flex; flex-direction: column; gap: 4px; text-align: left;
    background: var(--surface); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px;
    padding: 13px 14px; cursor: pointer; color: var(--text-primary); font-family: 'Inter', sans-serif; width: 100%;
  }
  .history-row-main { display: flex; align-items: center; gap: 8px; }
  .history-row-range { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 0.02em; }
  .history-row-tag {
    font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--accent); background: rgba(255,201,74,0.1); padding: 2px 7px; border-radius: 6px;
  }
  .history-row-stat { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--text-secondary); }

  .year-section { margin-bottom: 18px; }
  .year-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--steel-light); margin-bottom: 10px;
  }
  .month-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .month-tile {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: var(--surface); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px;
    padding: 14px 8px; cursor: pointer;
  }
  .month-tile-name { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--text-primary); }
  .month-tile-stat { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-secondary); }

  .stats-card { margin-bottom: 16px; padding: 16px; }
  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .stat-tile { background: var(--surface-alt); border-radius: 10px; padding: 12px; text-align: center; }
  .stat-value { display: block; font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--accent); }
  .stat-label {
    display: block; font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--text-secondary); margin-top: 4px;
  }

  .week-stats-strip {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-secondary); text-align: center;
    margin-bottom: 14px; padding: 10px; background: var(--surface); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px;
  }

  .history-detail { display: flex; flex-direction: column; gap: 14px; }
  .history-day { background: var(--surface); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 14px 16px; }
  .history-day-label { font-family: 'Bebas Neue', sans-serif; font-size: 19px; margin-bottom: 8px; }
  .history-day-empty { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--steel-light); }
  .history-ex-row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13.5px; }
  .history-ex-row:last-child { border-bottom: none; }
  .history-ex-name { color: var(--text-primary); }
  .history-ex-log { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--accent-dim); white-space: nowrap; }

  .supp-card { margin-top: 14px; }
  .supp-title { font-size: 22px; }

  .supp-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 2px; }
  .supp-row:first-of-type { border-bottom: 1px solid rgba(255,255,255,0.05); }

  .supp-info { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .supp-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .supp-name { font-size: 14.5px; font-weight: 500; color: var(--text-primary); }

  .supp-amount-input {
    background: var(--surface-alt); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
    padding: 8px 10px; color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 13.5px;
    outline: none; width: 160px; max-width: 100%;
  }
  .supp-amount-input:focus { border-color: var(--accent); }

  .cycle-badge {
    font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 6px;
  }
  .cycle-badge.on { color: var(--accent); background: rgba(255,201,74,0.12); }
  .cycle-badge.off { color: var(--steel-light); background: rgba(255,255,255,0.05); }

  .supp-settings-form { margin-top: 12px; padding: 12px; background: var(--surface-alt); border-radius: 12px; display: flex; flex-direction: column; gap: 10px; }
  .supp-toggle-row { display: flex; align-items: center; gap: 8px; font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text-primary); }
  .supp-toggle-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
  .supp-settings-grid { display: flex; gap: 10px; }
  .supp-settings-form input[type="date"] {
    background: var(--bg); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;

</style>
