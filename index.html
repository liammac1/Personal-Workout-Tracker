<body>
  <div class="app-root" id="app"></div>

<script>
  // -------------------------------------------------------------------------
  // Default program data — from the Home Gym PDF
  // -------------------------------------------------------------------------
  const DEFAULT_PROGRAM = [
    { key: "mon", label: "Monday", short: "MON", focus: "Rest", rest: true,
      note: "Full rest day. Light walking / stretching optional. Prioritize sleep and protein intake." },
    { key: "tue", label: "Tuesday", short: "TUE", focus: "Push — Chest / Shoulders / Triceps", rest: false,
      exercises: [
        { id: "tue-1", name: "Barbell Flat Bench Press", target: "4 x 6-10" },
        { id: "tue-2", name: "Incline Dumbbell Press", target: "3 x 8-12" },
        { id: "tue-3", name: "Dumbbell Shoulder Press", target: "3 x 8-12" },
        { id: "tue-4", name: "Cable Lateral Raise (York)", target: "3 x 12-15" },
        { id: "tue-5", name: "Cable Tricep Pushdown (York)", target: "3 x 10-15" },
        { id: "tue-6", name: "DB Overhead Tricep Extension", target: "2 x 10-12" },
      ]},
    { key: "wed", label: "Wednesday", short: "WED", focus: "Pull — Back / Biceps", rest: false,
      exercises: [
        { id: "wed-1", name: "Cable Lat Pulldown (York)", target: "4 x 8-12" },
        { id: "wed-2", name: "Bent-Over Dumbbell Row", target: "4 x 8-12" },
        { id: "wed-3", name: "Cable Seated Row (York)", target: "3 x 10-12" },
        { id: "wed-4", name: "Dumbbell Rear Delt Fly", target: "2 x 12-15" },
        { id: "wed-5", name: "Barbell or Dumbbell Curl", target: "3 x 8-12" },
        { id: "wed-6", name: "Hammer Curl", target: "2 x 10-12" },
      ]},
    { key: "thu", label: "Thursday", short: "THU", focus: "Legs", rest: false,
      exercises: [
        { id: "thu-1", name: "Dumbbell Goblet Squat", target: "4 x 8-12" },
        { id: "thu-2", name: "Dumbbell Romanian Deadlift", target: "4 x 8-10" },
        { id: "thu-3", name: "Bulgarian Split Squat", target: "3 x 10-12 / leg" },
        { id: "thu-4", name: "Leg Press or Leg Ext. (York)", target: "3 x 12-15" },
        { id: "thu-5", name: "Standing Calf Raise", target: "4 x 12-15" },
      ]},
    { key: "fri", label: "Friday", short: "FRI", focus: "Rest", rest: true,
      note: "Full rest day. Light walking / stretching optional. Prioritize sleep and protein intake." },
    { key: "sat", label: "Saturday", short: "SAT", focus: "Upper Body", rest: false,
      exercises: [
        { id: "sat-1", name: "Incline Barbell/DB Bench", target: "3 x 8-10" },
        { id: "sat-2", name: "Cable Lat Pulldown (York)", target: "3 x 8-10" },
        { id: "sat-3", name: "Dumbbell Shoulder Press", target: "3 x 10-12" },
        { id: "sat-4", name: "Cable Row (York)", target: "3 x 10-12" },
        { id: "sat-5", name: "Dumbbell Curl", target: "2 x 10-12" },
        { id: "sat-6", name: "Cable Pushdown (York)", target: "2 x 10-12" },
      ]},
    { key: "sun", label: "Sunday", short: "SUN", focus: "Lower Body + Core", rest: false,
      exercises: [
        { id: "sun-1", name: "Dumbbell RDL", target: "3 x 8-10" },
        { id: "sun-2", name: "Bulgarian Split Squat", target: "3 x 10-12 / leg" },
        { id: "sun-3", name: "Leg Curl (York)", target: "3 x 12-15" },
        { id: "sun-4", name: "Leg Extension (York)", target: "3 x 12-15" },
        { id: "sun-5", name: "Standing Calf Raise", target: "3 x 15" },
        { id: "sun-6", name: "Hanging Leg Raise / Cable Crunch", target: "3 x 12-15" },
      ]},
  ];

  const DAY_ORDER = ["mon","tue","wed","thu","fri","sat","sun"];
  const JS_DAY_TO_KEY = ["sun","mon","tue","wed","thu","fri","sat"];
  const STORAGE_PREFIX = "homegym-progress:";
  const PROGRAM_STORAGE_KEY = "homegym-program-v1";
  const PROGRAMS_STORE_KEY = "homegym-programs-v1";
  const SUPP_SETTINGS_KEY = "homegym-supp-settings-v1";
  const ACTIVE_SESSION_KEY = "homegym-active-session-v1";
  const SUPPLEMENTS_LIST_KEY = "homegym-supplements-list-v1";

  const DEFAULT_SUPPLEMENTS = [
    { id: "creatine", name: "Creatine", placeholder: "grams" },
    { id: "protein", name: "Protein", placeholder: "grams or servings" },
  ];

  function loadSupplementsList() {
    try {
      const raw = localStorage.getItem(SUPPLEMENTS_LIST_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return JSON.parse(JSON.stringify(DEFAULT_SUPPLEMENTS));
  }
  function saveSupplementsList() {
    try { localStorage.setItem(SUPPLEMENTS_LIST_KEY, JSON.stringify(SUPPLEMENTS_LIST)); }
    catch (e) {}
  }
  function generateSuppId() {
    return "supp-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }
  function addSupplement(name) {
    if (!name.trim()) return;
    SUPPLEMENTS_LIST.push({ id: generateSuppId(), name: name.trim(), placeholder: "amount" });
    saveSupplementsList();
  }
  function removeSupplement(id) {
    const idx = SUPPLEMENTS_LIST.findIndex(s => s.id === id);
    if (idx === -1) return;
    const [removed] = SUPPLEMENTS_LIST.splice(idx, 1);
    saveSupplementsList();
    const removedLogs = {};
    Object.keys(progress).forEach(dayKey => {
      if (progress[dayKey] && progress[dayKey].supplements && progress[dayKey].supplements[id]) {
        removedLogs[dayKey] = progress[dayKey].supplements[id];
        delete progress[dayKey].supplements[id];
      }
    });
    saveProgress(weekKey, progress);
    showUndoToast({
      message: `"${removed.name}" removed`,
      undo: () => {
        const insertAt = Math.min(idx, SUPPLEMENTS_LIST.length);
        SUPPLEMENTS_LIST.splice(insertAt, 0, removed);
        saveSupplementsList();
        Object.keys(removedLogs).forEach(dayKey => {
          const dp = { ...(progress[dayKey] || {}) };
          const supp = { ...(dp.supplements || {}) };
          supp[id] = removedLogs[dayKey];
          dp.supplements = supp;
          progress = { ...progress, [dayKey]: dp };
        });
        saveProgress(weekKey, progress);
      },
    });
  }

  function todayDateStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }

  function loadActiveSession() {
    try {
      const raw = localStorage.getItem(ACTIVE_SESSION_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return null;
  }
  function saveActiveSession() {
    try {
      if (activeSession) localStorage.setItem(ACTIVE_SESSION_KEY, JSON.stringify(activeSession));
      else localStorage.removeItem(ACTIVE_SESSION_KEY);
    } catch (e) {}
  }

  const REST_TIMER_SECONDS = 90;
  let audioCtx = null;

  function primeAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) {}
    } else if (audioCtx.state === "suspended") {
      try { audioCtx.resume(); } catch (e) {}
    }
  }

  function playRestCompleteSound() {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === "suspended") audioCtx.resume();
      const now = audioCtx.currentTime;
      [0, 0.18].forEach(offset => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, now + offset);
        gain.gain.exponentialRampToValueAtTime(0.35, now + offset + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + offset);
        osc.stop(now + offset + 0.16);
      });
    } catch (e) {}
  }

  function startWorkoutSession(dayKey) {
    primeAudio();
    const now = Date.now();
    activeSession = {
      dayKey,
      weekKey: weekKey,
      mode: "exercise",
      modeStartedAt: now,
      exerciseSeconds: 0,
      restSeconds: 0,
      sessionStartedAt: now,
      restAlertFired: false,
    };
    saveActiveSession();
  }

  function toggleSessionMode() {
    if (!activeSession) return;
    primeAudio();
    const now = Date.now();
    const elapsed = Math.floor((now - activeSession.modeStartedAt) / 1000);
    if (activeSession.mode === "exercise") activeSession.exerciseSeconds += elapsed;
    else activeSession.restSeconds += elapsed;
    activeSession.mode = activeSession.mode === "exercise" ? "rest" : "exercise";
    activeSession.modeStartedAt = now;
    activeSession.restAlertFired = false;
    saveActiveSession();
  }

  function stopWorkoutSession() {
    if (!activeSession) return null;
    const now = Date.now();
    const elapsed = Math.floor((now - activeSession.modeStartedAt) / 1000);
    if (activeSession.mode === "exercise") activeSession.exerciseSeconds += elapsed;
    else activeSession.restSeconds += elapsed;

    const summary = {
      totalSeconds: activeSession.exerciseSeconds + activeSession.restSeconds,
      exerciseSeconds: activeSession.exerciseSeconds,
      restSeconds: activeSession.restSeconds,
      startedAt: activeSession.sessionStartedAt,
      endedAt: now,
    };

    const sessDayKey = activeSession.dayKey;
    const sessWeekKey = activeSession.weekKey;
    const wp = sessWeekKey === weekKey ? progress : loadProgress(sessWeekKey);
    const dp = { ...(wp[sessDayKey] || {}) };
    dp.workoutTimer = summary;
    const newWp = { ...wp, [sessDayKey]: dp };
    saveProgress(sessWeekKey, newWp);
    if (sessWeekKey === weekKey) progress = newWp;

    activeSession = null;
    saveActiveSession();
    return summary;
  }

  function discardWorkoutSession() {
    if (!activeSession) return;
    const snapshot = { ...activeSession };
    activeSession = null;
    saveActiveSession();
    showUndoToast({
      message: "Workout session discarded",
      undo: () => {
        activeSession = snapshot;
        saveActiveSession();
      },
    });
  }

  function clearWorkoutTimer(dayKey) {
    const dp = progress[dayKey];
    if (!dp || !dp.workoutTimer) return;
    const removed = dp.workoutTimer;
    const newDp = { ...dp };
    delete newDp.workoutTimer;
    progress = { ...progress, [dayKey]: newDp };
    saveProgress(weekKey, progress);
    showUndoToast({
      message: "Workout session cleared",
      undo: () => {
        const dp2 = { ...(progress[dayKey] || {}) };
        dp2.workoutTimer = removed;
        progress = { ...progress, [dayKey]: dp2 };
        saveProgress(weekKey, progress);
      },
    });
  }

  function currentElapsedSeconds(session) {
    const now = Date.now();
    const runningElapsed = Math.floor((now - session.modeStartedAt) / 1000);
    const exerciseSeconds = session.exerciseSeconds + (session.mode === "exercise" ? runningElapsed : 0);
    const restSeconds = session.restSeconds + (session.mode === "rest" ? runningElapsed : 0);
    return { exerciseSeconds, restSeconds, totalSeconds: exerciseSeconds + restSeconds };
  }

  function restCountdownInfo(session) {
    if (!session || session.mode !== "rest") return null;
    const elapsed = Math.floor((Date.now() - session.modeStartedAt) / 1000);
    const remaining = REST_TIMER_SECONDS - elapsed;
    return { elapsed, remaining, isOver: remaining <= 0 };
  }

  function formatDuration(totalSeconds) {
    const s = Math.max(0, Math.floor(totalSeconds));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
    return `${m}:${String(sec).padStart(2, "0")}`;
  }

  function tickTimerDisplay() {
    if (!activeSession) return;
    const { exerciseSeconds, restSeconds, totalSeconds } = currentElapsedSeconds(activeSession);
    const totalEl = document.getElementById("timer-total");
    if (totalEl) totalEl.textContent = formatDuration(totalSeconds);
    const exEl = document.getElementById("timer-exercise");
    if (exEl) exEl.textContent = formatDuration(exerciseSeconds);
    const restEl = document.getElementById("timer-rest");
    if (restEl) restEl.textContent = formatDuration(restSeconds);
    const bannerEl = document.getElementById("timer-banner-elapsed");
    if (bannerEl) bannerEl.textContent = formatDuration(totalSeconds);

    const rc = restCountdownInfo(activeSession);
    if (rc) {
      if (rc.isOver && !activeSession.restAlertFired) {
        activeSession.restAlertFired = true;
        saveActiveSession();
        playRestCompleteSound();
      }
      const rcEl = document.getElementById("timer-rest-countdown");
      if (rcEl) {
        rcEl.textContent = rc.isOver ? `Rest complete +${formatDuration(-rc.remaining)}` : `Rest: ${formatDuration(rc.remaining)} left`;
        rcEl.classList.toggle("over", rc.isOver);
      }
    }
  }

  function loadSuppSettings() {
    try {
      const raw = localStorage.getItem(SUPP_SETTINGS_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { enabled: false, daysOn: 5, daysOff: 2, startDate: todayDateStr() };
  }
  function saveSuppSettings() {
    try { localStorage.setItem(SUPP_SETTINGS_KEY, JSON.stringify(SUPP_SETTINGS)); }
    catch (e) {}
  }

  function dateForDayKey(dayKey, wk) {
    const offset = DAY_ORDER.indexOf(dayKey);
    const d = new Date(wk + "T00:00:00");
    d.setDate(d.getDate() + (offset === -1 ? 0 : offset));
    return d;
  }

  function creatineCycleStatus(settings, dateObj) {
    if (!settings.enabled || !settings.daysOn) return null;
    const cycleLen = settings.daysOn + settings.daysOff;
    if (cycleLen <= 0) return null;
    const start = new Date(settings.startDate + "T00:00:00");
    const diffDays = Math.floor((dateObj - start) / 86400000);
    if (diffDays < 0) return null;
    const posInCycle = diffDays % cycleLen;
    const onPhase = posInCycle < settings.daysOn;
    const dayInPhase = onPhase ? posInCycle + 1 : posInCycle - settings.daysOn + 1;
    const phaseLen = onPhase ? settings.daysOn : settings.daysOff;
    return { onPhase, dayInPhase, phaseLen };
  }

  function cloneProgram(p) { return JSON.parse(JSON.stringify(p)); }

  function blankProgramDays() {
    return DEFAULT_PROGRAM.map(d => ({
      key: d.key, label: d.label, short: d.short, focus: "Rest", rest: true,
      note: "Full rest day. Light walking / stretching optional. Prioritize sleep and protein intake.",
    }));
  }

  function generateProgramId() {
    return "prog-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function defaultProgramsStore() {
    return { programs: [{ id: "default", name: "Home Gym", days: cloneProgram(DEFAULT_PROGRAM) }], activeId: "default" };
  }

  function loadProgramsStore() {
    try {
      const raw = localStorage.getItem(PROGRAMS_STORE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.programs) && parsed.programs.length > 0) return parsed;
      }
    } catch (e) {}
    // Migrate from the older single-program storage, if present, so existing edits aren't lost.
    try {
      const oldRaw = localStorage.getItem(PROGRAM_STORAGE_KEY);
      if (oldRaw) {
        const days = JSON.parse(oldRaw);
        if (Array.isArray(days) && days.length > 0) {
          return { programs: [{ id: "default", name: "My Program", days }], activeId: "default" };
        }
      }
    } catch (e) {}
    return defaultProgramsStore();
  }

  function saveProgramsStore() {
    try { localStorage.setItem(PROGRAMS_STORE_KEY, JSON.stringify(PROGRAMS_STORE)); }
    catch (e) {}
  }

  function getActiveProgramEntry() {
    return PROGRAMS_STORE.programs.find(p => p.id === PROGRAMS_STORE.activeId) || PROGRAMS_STORE.programs[0];
  }

  function saveProgram() { saveProgramsStore(); }

  // Repairs days that were incorrectly left as "training days" with zero exercises
  // (a state that could previously occur when a rest day's last exercise was removed).
  // Safe to run any time a program's days are loaded — a no-op on already-healthy data.
  function sanitizeProgramDays(days) {
    let changed = false;
    (days || []).forEach(day => {
      const hasExercises = Array.isArray(day.exercises) && day.exercises.length > 0;
      if (!day.rest && !hasExercises) {
        day.rest = true;
        if (day.focus === "Custom Day") day.focus = "Rest";
        if (!day.note) {
          day.note = "Full rest day. Light walking / stretching optional. Prioritize sleep and protein intake.";
        }
        changed = true;
      }
    });
    return changed;
  }

  function switchProgram(id) {
    const entry = PROGRAMS_STORE.programs.find(p => p.id === id);
    if (!entry) return;
    PROGRAMS_STORE.activeId = id;
    PROGRAM = entry.days;
    if (sanitizeProgramDays(PROGRAM)) saveProgramsStore();
  }

  function createProgram(name) {
    if (!name.trim()) return;
    const entry = { id: generateProgramId(), name: name.trim(), days: blankProgramDays() };
    PROGRAMS_STORE.programs.push(entry);
    switchProgram(entry.id);
  }

  function duplicateProgram(id) {
    const source = PROGRAMS_STORE.programs.find(p => p.id === id);
    if (!source) return;
    const days = cloneProgram(source.days).map(day => {
      if (Array.isArray(day.exercises)) {
        day.exercises = day.exercises.map(ex => ({ ...ex, id: generateId(day.key) }));
      }
      return day;
    });
    const entry = { id: generateProgramId(), name: source.name + " (Copy)", days };
    PROGRAMS_STORE.programs.push(entry);
    saveProgramsStore();
  }

  function renameProgram(id, name) {
    if (!name.trim()) return;
    const entry = PROGRAMS_STORE.programs.find(p => p.id === id);
    if (!entry) return;
    entry.name = name.trim();
    saveProgramsStore();
  }

  function deleteProgram(id) {
    if (PROGRAMS_STORE.programs.length <= 1) return;
    const idx = PROGRAMS_STORE.programs.findIndex(p => p.id === id);
    if (idx === -1) return;
    const [removed] = PROGRAMS_STORE.programs.splice(idx, 1);
    const wasActive = PROGRAMS_STORE.activeId === id;
    if (wasActive) {
      PROGRAMS_STORE.activeId = PROGRAMS_STORE.programs[0].id;
      PROGRAM = PROGRAMS_STORE.programs[0].days;
    }
    saveProgramsStore();
    showUndoToast({
      message: `"${removed.name}" deleted`,
      undo: () => {
        const insertAt = Math.min(idx, PROGRAMS_STORE.programs.length);
        PROGRAMS_STORE.programs.splice(insertAt, 0, removed);
        if (wasActive) {
          PROGRAMS_STORE.activeId = removed.id;
          PROGRAM = removed.days;
        }
        saveProgramsStore();
      },
    });
  }

  function getWeekKey(date = new Date()) {
    const d = new Date(date);
    const day = d.getDay();
    const diffToMonday = day === 0 ? -6 : 1 - day;
    d.setHours(0,0,0,0);
    d.setDate(d.getDate() + diffToMonday);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }
  function todayKey() { return JS_DAY_TO_KEY[new Date().getDay()]; }

  function loadProgress(wk) {
    try {
      const raw = localStorage.getItem(STORAGE_PREFIX + wk);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function saveProgress(wk, prog) {
    try { localStorage.setItem(STORAGE_PREFIX + wk, JSON.stringify(prog)); }
    catch (e) {}
  }

  function listStoredWeeks() {
    const weeks = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf(STORAGE_PREFIX) === 0) weeks.push(k.slice(STORAGE_PREFIX.length));
      }
    } catch (e) {}
    weeks.sort();
    weeks.reverse();
    return weeks;
  }

  function formatWeekRange(wk) {
    const start = new Date(wk + "T00:00:00");
    const end = new Date(start);
    end.setDate(end.getDate() + 6);
    const opts = { month: "short", day: "numeric" };
    return `${start.toLocaleDateString(undefined, opts)} – ${end.toLocaleDateString(undefined, opts)}`;
  }

  function normalizeEntryRaw(raw) {
    if (raw && typeof raw === "object") {
      return {
        done: !!raw.done,
        weight: raw.weight || "",
        reps: raw.reps || "",
        name: raw.name || "",
        target: raw.target || "",
        setsCompleted: typeof raw.setsCompleted === "number" ? raw.setsCompleted : 0,
      };
    }
    return { done: !!raw, weight: "", reps: "", name: "", target: "", setsCompleted: 0 };
  }

  function parseTotalSets(target) {
    const match = String(target || "").match(/^(\d+)/);
    const n = match ? parseInt(match[1], 10) : NaN;
    return n > 0 ? n : 3;
  }

  function summarizeWeek(wk) {
    const wp = loadProgress(wk);
    let daysWithActivity = 0;
    let exercisesLogged = 0;
    Object.keys(wp).forEach(dayKey => {
      const entries = wp[dayKey] || {};
      const doneCount = Object.values(entries).filter(e => normalizeEntryRaw(e).done).length;
      if (doneCount > 0) daysWithActivity++;
      exercisesLogged += doneCount;
    });
    return { daysWithActivity, exercisesLogged };
  }

  function groupWeeksByMonth() {
    const weeks = listStoredWeeks();
    const byMonth = {};
    weeks.forEach(wk => {
      const monthKey = wk.slice(0, 7);
      if (!byMonth[monthKey]) byMonth[monthKey] = [];
      byMonth[monthKey].push(wk);
    });
    return byMonth;
  }

  function computeMonthStats(weekKeys) {
    let daysActive = 0;
    let exercisesLogged = 0;
    let setsLogged = 0;
    let totalWeightVolume = 0;
    let totalDurationSeconds = 0;
    let sessionsWithDuration = 0;

    weekKeys.forEach(wk => {
      const wp = loadProgress(wk);
      DAY_ORDER.forEach(dayKey => {
        const entries = wp[dayKey] || {};
        let dayHasDone = false;
        Object.keys(entries).forEach(exId => {
          if (exId === "supplements" || exId === "workoutTimer") return;
          const norm = normalizeEntryRaw(entries[exId]);
          if (norm.done) { exercisesLogged++; dayHasDone = true; }
          if (norm.setsCompleted > 0) setsLogged += norm.setsCompleted;
          const w = extractNumber(norm.weight);
          const r = extractNumber(norm.reps);
          if (w !== null && r !== null) totalWeightVolume += w * r;
        });
        if (dayHasDone) daysActive++;
        if (entries.workoutTimer) {
          totalDurationSeconds += entries.workoutTimer.totalSeconds || 0;
          sessionsWithDuration++;
        }
      });
    });

    const avgDuration = sessionsWithDuration > 0 ? Math.round(totalDurationSeconds / sessionsWithDuration) : 0;
    return { daysActive, exercisesLogged, setsLogged, totalWeightVolume, totalDurationSeconds, sessionsWithDuration, avgDuration, weeksCount: weekKeys.length };
  }

  // -------------------------------------------------------------------------
  // State
  // -------------------------------------------------------------------------
  let PROGRAMS_STORE = loadProgramsStore();
  let PROGRAM = getActiveProgramEntry().days;
  if (sanitizeProgramDays(PROGRAM)) saveProgramsStore();
  let weekKey = getWeekKey();
  let activeDay = todayKey();
  let progress = loadProgress(weekKey);
  let editMode = false;
  let addFormOpen = false;
  let expandedSet = new Set();
  let view = "today"; // 'today' | 'history-months' | 'history-month-detail' | 'history-detail' | 'programs-list' | 'charts-list' | 'chart-detail'
  let historyWeekKey = null;
  let historyMonthKey = null;
  let SUPP_SETTINGS = loadSuppSettings();
  let suppSettingsOpen = false;
  let SUPPLEMENTS_LIST = loadSupplementsList();
  let suppEditMode = false;
  let suppAddFormOpen = false;
  let newProgramFormOpen = false;
  let renamingProgramId = null;
  let undoToast = null; // { message, undo, timeoutId }
  let chartExerciseName = null;
  let importError = null;
  let activeSession = loadActiveSession();
  let groupSelectSet = new Set();

  function resetTransientState() {
    editMode = false;
    addFormOpen = false;
    expandedSet = new Set();
    suppSettingsOpen = false;
    suppEditMode = false;
    suppAddFormOpen = false;
    newProgramFormOpen = false;
    renamingProgramId = null;
    importError = null;
    groupSelectSet = new Set();
  }

  function showUndoToast(opts) {
    if (undoToast && undoToast.timeoutId) clearTimeout(undoToast.timeoutId);
    const timeoutId = setTimeout(() => {
      undoToast = null;
      render();
    }, 6000);
    undoToast = { message: opts.message, undo: opts.undo, timeoutId };
  }

  function dismissUndoToast() {
    if (undoToast && undoToast.timeoutId) clearTimeout(undoToast.timeoutId);
    undoToast = null;
  }

  function toastMarkup() {
    if (!undoToast) return "";
    const undoBtnHTML = undoToast.undo ? `<button id="undo-toast-btn">Undo</button>` : "";
    return `<div class="undo-toast"><span>${undoToast.message}</span>${undoBtnHTML}</div>`;
  }

  function bindToastEvents(app) {
    const undoBtn = app.querySelector("#undo-toast-btn");
    if (undoBtn) {
      undoBtn.addEventListener("click", () => {
        if (undoToast && undoToast.undo) undoToast.undo();
        dismissUndoToast();
        render();
      });
    }
  }

  function trainingDayKeys() { return PROGRAM.filter(d => !d.rest).map(d => d.key); }

  function getEntry(dayKey, exId, ex) {
    const dp = progress[dayKey] || {};
    const norm = normalizeEntryRaw(dp[exId]);
    if (!norm.name && ex) norm.name = ex.name;
    if (!norm.target && ex) norm.target = ex.target;
    return norm;
  }

  function setEntry(dayKey, exId, patch, ex) {
    const current = getEntry(dayKey, exId, ex);
    const next = { ...current, ...patch };
    if (ex) { next.name = ex.name; next.target = ex.target; }
    const dayProgress = { ...(progress[dayKey] || {}) };
    dayProgress[exId] = next;
    progress = { ...progress, [dayKey]: dayProgress };
    saveProgress(weekKey, progress);
  }

  function getSupplement(dayKey, type) {
    const dp = progress[dayKey] || {};
    const supp = dp.supplements || {};
    const raw = supp[type];
    if (raw && typeof raw === "object") return { done: !!raw.done, amount: raw.amount || "" };
    return { done: false, amount: "" };
  }

  function setSupplement(dayKey, type, patch) {
    const dp = { ...(progress[dayKey] || {}) };
    const supp = { ...(dp.supplements || {}) };
    const current = getSupplement(dayKey, type);
    supp[type] = { ...current, ...patch };
    dp.supplements = supp;
    progress = { ...progress, [dayKey]: dp };
    saveProgress(weekKey, progress);
  }

  function dayCompletion(day) {
    if (day.rest) return { done: 0, total: 0, isComplete: true };
    const exercises = Array.isArray(day.exercises) ? day.exercises : [];
    const done = exercises.filter(e => getEntry(day.key, e.id, e).done).length;
    return { done, total: exercises.length, isComplete: exercises.length > 0 && done === exercises.length };
  }

  function generateId(dayKey) {
    return dayKey + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function addExercise(dayKey, name, target) {
    const day = PROGRAM.find(d => d.key === dayKey);
    if (!day || !name.trim()) return;
    if (!Array.isArray(day.exercises)) day.exercises = [];
    if (day.rest) {
      day.rest = false;
      if (day.focus === "Rest") day.focus = "Custom Day";
    }
    day.exercises.push({ id: generateId(dayKey), name: name.trim(), target: target.trim() || "—" });
    saveProgram();
  }

  function removeExercise(dayKey, exId) {
    const day = PROGRAM.find(d => d.key === dayKey);
    if (!day || !Array.isArray(day.exercises)) return;
    const idx = day.exercises.findIndex(e => e.id === exId);
    if (idx === -1) return;
    const supersetSnapshot = day.exercises.map(ex => ({ id: ex.id, supersetId: ex.supersetId }));
    const [removed] = day.exercises.splice(idx, 1);
    dissolveSingletonGroups(day);

    let revertedToRest = false;
    if (day.exercises.length === 0 && !day.rest) {
      day.rest = true;
      if (!day.note) {
        day.note = "Full rest day. Light walking / stretching optional. Prioritize sleep and protein intake.";
      }
      revertedToRest = true;
    }

    let removedProgressEntry = null;
    if (progress[dayKey] && progress[dayKey][exId] !== undefined) {
      removedProgressEntry = progress[dayKey][exId];
      delete progress[dayKey][exId];
      saveProgress(weekKey, progress);
    }
    saveProgram();
    showUndoToast({
      message: `"${removed.name}" removed`,
      undo: () => {
        const d = PROGRAM.find(dd => dd.key === dayKey);
        if (d) {
          if (revertedToRest) d.rest = false;
          if (!Array.isArray(d.exercises)) d.exercises = [];
          const insertAt = Math.min(idx, d.exercises.length);
          d.exercises.splice(insertAt, 0, removed);
          // restore every exercise's superset membership exactly as it was, undoing any auto-dissolve
          supersetSnapshot.forEach(snap => {
            const ex = d.exercises.find(e => e.id === snap.id);
            if (ex) {
              if (snap.supersetId) ex.supersetId = snap.supersetId;
              else delete ex.supersetId;
            }
          });
          saveProgram();
        }
        if (removedProgressEntry !== null) {
          const dp = { ...(progress[dayKey] || {}) };
          dp[exId] = removedProgressEntry;
          progress = { ...progress, [dayKey]: dp };
          saveProgress(weekKey, progress);
        }
      },
    });
  }

  function generateSupersetId() {
    return "ss-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function dissolveSingletonGroups(day) {
    if (!Array.isArray(day.exercises)) return;
    const counts = {};
    day.exercises.forEach(ex => {
      if (ex.supersetId) counts[ex.supersetId] = (counts[ex.supersetId] || 0) + 1;
    });
    day.exercises.forEach(ex => {
      if (ex.supersetId && counts[ex.supersetId] < 2) delete ex.supersetId;
    });
  }

  function createSuperset(dayKey) {
    const day = PROGRAM.find(d => d.key === dayKey);
    if (!day || !Array.isArray(day.exercises) || groupSelectSet.size < 2) return;
    const id = generateSupersetId();
    day.exercises.forEach(ex => {
      if (groupSelectSet.has(ex.id)) ex.supersetId = id;
    });
    groupSelectSet = new Set();
    saveProgram();
  }

  function removeFromSuperset(dayKey, exId) {
    const day = PROGRAM.find(d => d.key === dayKey);
    if (!day || !Array.isArray(day.exercises)) return;
    const ex = day.exercises.find(e => e.id === exId);
    if (!ex) return;
    delete ex.supersetId;
    dissolveSingletonGroups(day);
    saveProgram();
  }

  function computeSupersetLabels(exercises) {
    const counts = {};
    (exercises || []).forEach(ex => {
      if (ex.supersetId) counts[ex.supersetId] = (counts[ex.supersetId] || 0) + 1;
    });
    const labels = {};
    let nextCharCode = 65; // 'A'
    (exercises || []).forEach(ex => {
      if (ex.supersetId && counts[ex.supersetId] >= 2 && !labels[ex.supersetId]) {
        labels[ex.supersetId] = String.fromCharCode(nextCharCode);
        nextCharCode++;
      }
    });
    return labels;
  }

  function barbellSVG(completedCount, total) {
    const plateCount = Math.min(Math.max(total - 1, 0), 4);
    const leftCount = Math.ceil(plateCount / 2);
    const rightCount = plateCount - leftCount;
    const platesLit = Math.min(completedCount, plateCount);
    const barLoaded = total > 0 && completedCount >= total;

    let rects = "";
    for (let i = 0; i < leftCount; i++) {
      const loaded = i < platesLit;
      const x = 40 - i * 10;
      const h = (14 + i * 2) * 2;
      rects += `<rect x="${x}" y="${30 - (14 + i*2)}" width="6" height="${h}" rx="2" fill="${loaded ? 'var(--accent)' : 'var(--surface-alt)'}" stroke="var(--steel)" stroke-width="1"/>`;
    }
    for (let i = 0; i < rightCount; i++) {
      const idx = leftCount + i;
      const loaded = idx < platesLit;
      const x = 280 + i * 10;
      const sizeIdx = rightCount - 1 - i;
      const h = (14 + sizeIdx * 2) * 2;
      rects += `<rect x="${x}" y="${30 - (14 + sizeIdx*2)}" width="6" height="${h}" rx="2" fill="${loaded ? 'var(--accent)' : 'var(--surface-alt)'}" stroke="var(--steel)" stroke-width="1"/>`;
    }
    const barStroke = barLoaded ? 'var(--accent)' : 'var(--steel)';
    const barFilter = barLoaded ? 'filter:drop-shadow(0 0 4px var(--accent));' : '';
    return `<svg viewBox="0 0 320 60" class="barbell-svg" aria-hidden="true">
      <line x1="10" y1="30" x2="310" y2="30" stroke="${barStroke}" stroke-width="4" style="transition:stroke 0.3s ease;${barFilter}" />
      ${rects}
    </svg>`;
  }

  function escAttr(str) { return String(str || "").replace(/"/g, "&quot;"); }

  function exportAllData() {
    const data = {};
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.indexOf("homegym-") === 0) {
          data[key] = localStorage.getItem(key);
        }
      }
    } catch (e) {}
    return { app: "home-gym-tracker", exportedAt: new Date().toISOString(), version: 1, data };
  }

  function downloadJSON(filename, dataObj) {
    try {
      const blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      return true;
    } catch (e) {
      return false;
    }
  }

  function formatSplitText(programEntry) {
    const lines = [];
    (programEntry.days || []).forEach(day => {
      lines.push(day.label);
      lines.push("");
      if (day.rest) {
        lines.push("* Rest");
      } else {
        const exercises = day.exercises || [];
        if (exercises.length === 0) {
          lines.push("* (no exercises)");
        } else {
          exercises.forEach(ex => lines.push(`* ${ex.name} — ${ex.target}`));
        }
      }
      lines.push("");
    });
    return lines.join("\n").trim();
  }

  async function copyTextToClipboard(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) {}
    try {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      const success = document.execCommand("copy");
      document.body.removeChild(textarea);
      return success;
    } catch (e) {
      return false;
    }
  }

  function importBackupFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const data = parsed && parsed.data && typeof parsed.data === "object" ? parsed.data : parsed;
        const keys = Object.keys(data || {}).filter(k => k.indexOf("homegym-") === 0);
        if (keys.length === 0) throw new Error("no recognizable data");
        keys.forEach(k => {
          try { localStorage.setItem(k, data[k]); } catch (e) {}
        });
        location.reload();
      } catch (e) {
        importError = "That file doesn't look like a valid Home Gym backup.";
        render();
      }
    };
    reader.onerror = () => {
      importError = "Couldn't read that file.";
      render();
    };
    reader.readAsText(file);
  }

  function extractNumber(str) {
    const m = String(str || "").match(/(\d+(\.\d+)?)/);
    return m ? parseFloat(m[1]) : null;
  }

  function collectWeightHistory() {
    const weeks = listStoredWeeks();
    const byName = {};
    weeks.forEach(wk => {
      const wp = loadProgress(wk);
      DAY_ORDER.forEach(dayKey => {
        const entries = wp[dayKey] || {};
        Object.keys(entries).forEach(exId => {
          if (exId === "supplements" || exId === "workoutTimer") return;
          const norm = normalizeEntryRaw(entries[exId]);
          if (!norm.weight) return;
          const value = extractNumber(norm.weight);
          if (value === null) return;
          const name = (norm.name || "Exercise").trim();
          if (!byName[name]) byName[name] = [];
          byName[name].push({ date: dateForDayKey(dayKey, wk), value, reps: norm.reps, weightLabel: norm.weight });
        });
      });
    });
    Object.keys(byName).forEach(name => byName[name].sort((a, b) => a.date - b.date));
    return byName;
  }

  function isNewPR(weightHistory, name, currentDateMs, currentValue) {
    if (!weightHistory || currentValue === null) return false;
    const points = weightHistory[name] || [];
    const priorValues = points.filter(p => p.date.getTime() !== currentDateMs).map(p => p.value);
    if (priorValues.length === 0) return false;
    return currentValue > Math.max(...priorValues);
  }

  function buildLineChartSVG(points) {
    const padding = { left: 34, right: 16, top: 22, bottom: 26 };
    const pointSpacing = 56;
    const width = Math.max(300, padding.left + padding.right + (points.length - 1) * pointSpacing + 20);
    const height = 180;
    const chartH = height - padding.top - padding.bottom;
    const values = points.map(p => p.value);
    let min = Math.min(...values);
    let max = Math.max(...values);
    if (min === max) { min -= 5; max += 5; }
    const range = max - min;
    const yFor = v => padding.top + chartH - ((v - min) / range) * chartH;
    const xFor = i => padding.left + i * pointSpacing;

    const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${xFor(i)} ${yFor(p.value)}`).join(" ");

    const dots = points.map((p, i) => `
      <circle cx="${xFor(i)}" cy="${yFor(p.value)}" r="4" fill="var(--accent)" />
      <text x="${xFor(i)}" y="${yFor(p.value) - 10}" text-anchor="middle" font-size="10" fill="var(--accent)" font-family="'IBM Plex Mono', monospace">${p.value}</text>
      <text x="${xFor(i)}" y="${height - 8}" text-anchor="middle" font-size="9" fill="var(--steel-light)" font-family="'IBM Plex Mono', monospace">${p.xLabel}</text>
    `).join("");

    return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" style="display:block;">
      <line x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${height - padding.bottom}" stroke="var(--steel)" stroke-width="1"/>
      <line x1="${padding.left}" y1="${height - padding.bottom}" x2="${width - padding.right}" y2="${height - padding.bottom}" stroke="var(--steel)" stroke-width="1"/>
      <text x="4" y="${padding.top + 4}" font-size="9" fill="var(--steel-light)" font-family="'IBM Plex Mono', monospace">${Math.round(max)}</text>
      <text x="4" y="${height - padding.bottom + 4}" font-size="9" fill="var(--steel-light)" font-family="'IBM Plex Mono', monospace">${Math.round(min)}</text>
      <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2"/>
      ${dots}
    </svg>`;
  }

  const GRIP_SVG = '<svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><circle cx="6" cy="5" r="1.6"/><circle cx="14" cy="5" r="1.6"/><circle cx="6" cy="10" r="1.6"/><circle cx="14" cy="10" r="1.6"/><circle cx="6" cy="15" r="1.6"/><circle cx="14" cy="15" r="1.6"/></svg>';

  function buildCardHTML(day) {
    const exercises = Array.isArray(day.exercises) ? day.exercises : [];
    const doneCount = exercises.filter(e => getEntry(day.key, e.id, e).done).length;
    const editToggleBtn = `<button class="icon-btn ${editMode ? 'active' : ''}" id="edit-toggle-btn" title="${editMode ? 'Done editing' : 'Edit exercises'}">${editMode ? '✓' : '✎'}</button>`;

    if (day.rest && !editMode) {
      return `<div class="card">
        <div class="card-head">
          <span class="focus-label">${day.focus}</span>
          <div class="card-head-right">${editToggleBtn}</div>
        </div>
        <div class="rest-block">
          <div class="rest-icon">☾</div>
          <div class="rest-text">${day.note || ''}</div>
        </div>
      </div>`;
    }

    const focusLabel = day.focus.includes("—") ? day.focus.split("—")[1].trim() : day.focus;
    const supersetLabels = computeSupersetLabels(exercises);
    const weightHistory = editMode ? null : collectWeightHistory();
    let prevSupersetId = null;

    let rowsHTML;
    if (exercises.length === 0) {
      rowsHTML = `<div class="empty-state">${editMode ? 'No exercises yet — add one below.' : 'Nothing scheduled. Tap ✎ to add exercises.'}</div>`;
    } else {
      rowsHTML = exercises.map(ex => {
        const groupLabel = ex.supersetId ? supersetLabels[ex.supersetId] : null;
        const startsGroup = groupLabel && ex.supersetId !== prevSupersetId;
        prevSupersetId = ex.supersetId || null;
        const groupTagHTML = startsGroup ? `<div class="superset-tag">SUPERSET ${groupLabel}</div>` : "";
        const groupClass = groupLabel ? "in-superset" : "";

        if (editMode) {
          const selected = groupSelectSet.has(ex.id);
          const groupBtnHTML = groupLabel
            ? `<button class="group-toggle-btn labeled" data-ungroup-ex="${ex.id}" title="Remove from superset ${groupLabel}">${groupLabel}</button>`
            : `<button class="group-toggle-btn ${selected ? 'selected' : ''}" data-group-select="${ex.id}" title="Select for superset">${selected ? '✓' : ''}</button>`;
          const dropsetBtnHTML = `<button class="dropset-toggle-btn ${ex.dropSet ? 'active' : ''}" data-dropset-ex="${ex.id}" title="${ex.dropSet ? 'Remove drop set' : 'Mark last set as a drop set'}">DS</button>`;
          return `<div class="exercise-row-wrap ${groupClass}" data-ex-id="${ex.id}">
            ${groupTagHTML}
            <div class="exercise-row edit-row">
              <div class="drag-handle" data-drag-ex="${ex.id}">${GRIP_SVG}</div>
              <button class="remove-btn" data-remove-ex="${ex.id}" title="Remove">✕</button>
              ${groupBtnHTML}
              ${dropsetBtnHTML}
              <div class="exercise-info edit-fields">
                <input type="text" class="inline-edit-input name-input" value="${escAttr(ex.name)}" data-rename-ex="${ex.id}" data-field="name" maxlength="60" />
                <input type="text" class="inline-edit-input target-input" value="${escAttr(ex.target)}" data-rename-ex="${ex.id}" data-field="target" maxlength="30" />
              </div>
            </div>
          </div>`;
        }
        const entry = getEntry(day.key, ex.id, ex);
        const expanded = expandedSet.has(ex.id);
        const totalSets = parseTotalSets(ex.target);
        const setsComplete = entry.setsCompleted >= totalSets;
        const currentValue = extractNumber(entry.weight);
        const currentDateMs = dateForDayKey(day.key, weekKey).getTime();
        const isPR = isNewPR(weightHistory, ex.name, currentDateMs, currentValue);
        const logBits = [entry.weight, entry.reps ? entry.reps + " reps" : ""].filter(Boolean).join(" × ");
        const prBadgeHTML = isPR ? ` <span class="pr-badge">🏆 PR</span>` : "";
        const dropsetTagHTML = ex.dropSet ? `<div class="dropset-tag">🔻 Last set is a drop set</div>` : "";
        const summaryHTML = (!expanded && logBits) ? `<div class="log-summary">${logBits}${prBadgeHTML}</div>` : "";
        const panelHTML = expanded ? `<div class="log-panel">
            <div class="log-field">
              <label>Weight${isPR ? ' <span class="pr-badge">🏆 PR</span>' : ''}</label>
              <input type="text" inputmode="decimal" placeholder="e.g. 135 lb" value="${escAttr(entry.weight)}" data-weight-ex="${ex.id}" />
            </div>
            <div class="log-field">
              <label>Reps</label>
              <input type="text" inputmode="numeric" placeholder="e.g. 8" value="${escAttr(entry.reps)}" data-reps-ex="${ex.id}" />
            </div>
          </div>` : "";
        return `<div class="exercise-row-wrap ${groupClass}">
          ${groupTagHTML}
          <div class="exercise-row ${entry.done ? 'done' : ''}">
            <div class="checkbox ${entry.done ? 'checked' : ''}" data-check-ex="${ex.id}">
              ${entry.done ? '<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#131319" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}
            </div>
            <div class="exercise-info" data-expand-ex="${ex.id}">
              <div class="exercise-name">${ex.name}</div>
              <div class="exercise-target">${ex.target}</div>
              ${dropsetTagHTML}
              ${summaryHTML}
            </div>
            <button class="sets-pill ${setsComplete ? 'complete' : ''} ${ex.dropSet ? 'has-dropset' : ''}" data-sets-ex="${ex.id}" title="Tap to log a set">${entry.setsCompleted}/${totalSets}${ex.dropSet ? ' 🔻' : ''}</button>
            <div class="expand-chevron" data-expand-ex="${ex.id}">${expanded ? '▴' : '▾'}</div>
          </div>
          ${panelHTML}
        </div>`;
      }).join("");
    }

    const groupActionHTML = (editMode && groupSelectSet.size >= 2)
      ? `<button class="add-exercise-btn group-action-btn" id="group-selected-btn">🔗 Group as Superset (${groupSelectSet.size} selected)</button>`
      : "";

    const addSectionHTML = editMode
      ? (addFormOpen
          ? `<div class="add-exercise-form">
              <input type="text" id="new-ex-name" placeholder="Exercise name" maxlength="60" />
              <input type="text" id="new-ex-target" placeholder="Target (e.g. 3 x 8-12)" maxlength="30" />
              <div class="add-exercise-actions">
                <button class="form-btn secondary" id="cancel-add-ex">Cancel</button>
                <button class="form-btn primary" id="confirm-add-ex">Add</button>
              </div>
            </div>`
          : `<button class="add-exercise-btn" id="open-add-ex">+ Add exercise</button>`)
      : "";

    return `<div class="card">
      <div class="card-head">
        ${editMode
          ? `<input type="text" class="day-title-input" data-day-focus-input="${day.key}" value="${escAttr(day.focus)}" maxlength="60" />`
          : `<span class="focus-label">${focusLabel}</span>`}
        <div class="card-head-right">
          ${!editMode ? `<span class="progress-chip">${doneCount}/${exercises.length}</span>` : ""}
          ${editToggleBtn}
        </div>
      </div>
      ${!editMode ? `<div class="card-sub">REST 2-3 MIN COMPOUND · 60-90S ISOLATION · LEAVE 1-2 IN TANK</div>` : ""}
      <div class="exercise-rows-container" id="exercise-rows">${rowsHTML}</div>
      ${groupActionHTML}
      ${addSectionHTML}
    </div>`;
  }

  function buildSupplementsCard(dayKey) {
    const dateObj = dateForDayKey(dayKey, weekKey);
    const status = creatineCycleStatus(SUPP_SETTINGS, dateObj);
    const checkSVG = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#131319" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    const manageToggleBtn = `<button class="icon-btn ${suppEditMode ? 'active' : ''}" id="supp-edit-toggle-btn" title="${suppEditMode ? 'Done editing' : 'Manage supplements'}">${suppEditMode ? '✓' : '✎'}</button>`;
    const cycleBtn = `<button class="icon-btn ${suppSettingsOpen ? 'active' : ''}" id="supp-settings-btn" title="Creatine cycle settings">⚙</button>`;

    let rowsHTML;
    if (SUPPLEMENTS_LIST.length === 0) {
      rowsHTML = `<div class="empty-state">${suppEditMode ? 'No supplements yet — add one below.' : 'No supplements tracked. Tap ✎ to add some.'}</div>`;
    } else {
      rowsHTML = SUPPLEMENTS_LIST.map(supp => {
        if (suppEditMode) {
          return `<div class="supp-row edit-row">
            <button class="remove-btn" data-remove-supp="${supp.id}" title="Remove">✕</button>
            <div class="supp-info"><span class="supp-name">${supp.name}</span></div>
          </div>`;
        }
        const entry = getSupplement(dayKey, supp.id);
        const badgeHTML = (supp.id === "creatine" && status)
          ? `<span class="cycle-badge ${status.onPhase ? 'on' : 'off'}">${status.onPhase ? 'ON' : 'OFF'} · Day ${status.dayInPhase}/${status.phaseLen}</span>`
          : "";
        return `<div class="supp-row">
          <div class="checkbox ${entry.done ? 'checked' : ''}" data-supp-check="${supp.id}">
            ${entry.done ? checkSVG : ''}
          </div>
          <div class="supp-info">
            <div class="supp-name-row"><span class="supp-name">${supp.name}</span>${badgeHTML}</div>
            <input class="supp-amount-input" type="text" inputmode="decimal" placeholder="${supp.placeholder || 'amount'}" value="${escAttr(entry.amount)}" data-supp-amount="${supp.id}" />
          </div>
        </div>`;
      }).join("");
    }

    const addSectionHTML = suppEditMode
      ? (suppAddFormOpen
          ? `<div class="add-exercise-form">
              <input type="text" id="new-supp-name" placeholder="Supplement name" maxlength="40" />
              <div class="add-exercise-actions">
                <button class="form-btn secondary" id="cancel-add-supp">Cancel</button>
                <button class="form-btn primary" id="confirm-add-supp">Add</button>
              </div>
            </div>`
          : `<button class="add-exercise-btn" id="open-add-supp">+ Add supplement</button>`)
      : "";

    const settingsHTML = suppSettingsOpen ? `
      <div class="supp-settings-form">
        <label class="supp-toggle-row">
          <input type="checkbox" id="supp-cycle-enabled" ${SUPP_SETTINGS.enabled ? "checked" : ""} />
          <span>Enable creatine on/off cycling</span>
        </label>
        <div class="supp-settings-grid">
          <div class="log-field"><label>Days On</label><input type="text" inputmode="numeric" id="supp-days-on" value="${escAttr(SUPP_SETTINGS.daysOn)}" /></div>
          <div class="log-field"><label>Days Off</label><input type="text" inputmode="numeric" id="supp-days-off" value="${escAttr(SUPP_SETTINGS.daysOff)}" /></div>
        </div>
        <div class="log-field"><label>Cycle start date</label><input type="date" id="supp-start-date" value="${escAttr(SUPP_SETTINGS.startDate)}" /></div>
        <button class="form-btn primary" id="supp-save-settings">Save cycle settings</button>
      </div>` : "";

    return `<div class="card supp-card">
      <div class="card-head">
        <span class="focus-label supp-title">Supplements</span>
        <div class="card-head-right">${cycleBtn}${manageToggleBtn}</div>
      </div>
      ${rowsHTML}
      ${addSectionHTML}
      ${settingsHTML}
    </div>`;
  }

  function buildTimerCard(dayKey) {
    if (activeSession) {
      if (activeSession.dayKey === dayKey) {
        const { exerciseSeconds, restSeconds, totalSeconds } = currentElapsedSeconds(activeSession);
        const isExercise = activeSession.mode === "exercise";
        const rc = restCountdownInfo(activeSession);
        const restCountdownHTML = rc
          ? `<div class="rest-countdown ${rc.isOver ? 'over' : ''}" id="timer-rest-countdown">${rc.isOver ? `Rest complete +${formatDuration(-rc.remaining)}` : `Rest: ${formatDuration(rc.remaining)} left`}</div>`
          : "";
        return `<div class="card timer-card">
          <div class="card-head">
            <span class="focus-label timer-title">Workout Timer</span>
            <span class="timer-mode-badge ${isExercise ? 'exercise' : 'rest'}">${isExercise ? 'EXERCISING' : 'RESTING'}</span>
          </div>
          <div class="timer-total-display" id="timer-total">${formatDuration(totalSeconds)}</div>
          ${restCountdownHTML}
          <div class="timer-split-row">
            <div class="timer-split">
              <span class="timer-split-label">Exercise</span>
              <span class="timer-split-value" id="timer-exercise">${formatDuration(exerciseSeconds)}</span>
            </div>
            <div class="timer-split">
              <span class="timer-split-label">Rest</span>
              <span class="timer-split-value" id="timer-rest">${formatDuration(restSeconds)}</span>
            </div>
          </div>
          <div class="timer-actions">
            <button class="form-btn ${isExercise ? 'secondary' : 'primary'}" id="timer-toggle-btn">${isExercise ? '⏸ Switch to Rest' : '▶ Switch to Exercise'}</button>
            <button class="form-btn danger" id="timer-stop-btn">⏹ Stop</button>
          </div>
          <button class="timer-discard-link" id="timer-discard-btn">Discard this session</button>
        </div>`;
      }
      const { totalSeconds } = currentElapsedSeconds(activeSession);
      const sessionDayLabel = (PROGRAM.find(d => d.key === activeSession.dayKey) || {}).label || activeSession.dayKey;
      return `<div class="card timer-card timer-banner">
        <span class="timer-banner-text">Workout running for ${sessionDayLabel} — <span id="timer-banner-elapsed">${formatDuration(totalSeconds)}</span></span>
        <button class="history-btn" id="timer-jump-btn">View</button>
      </div>`;
    }

    const dp = progress[dayKey] || {};
    const lastSummary = dp.workoutTimer;
    const summaryHTML = lastSummary
      ? `<div class="timer-last-summary">
          <span>Last session: ${formatDuration(lastSummary.totalSeconds)} <span class="timer-summary-split">(${formatDuration(lastSummary.exerciseSeconds)} exercise · ${formatDuration(lastSummary.restSeconds)} rest)</span></span>
          <button class="timer-clear-btn" data-clear-timer="${dayKey}" title="Clear this session">✕</button>
        </div>`
      : "";

    return `<div class="card timer-card">
      <div class="card-head">
        <span class="focus-label timer-title">Workout Timer</span>
      </div>
      ${summaryHTML}
      <button class="form-btn primary" id="timer-start-btn" style="width:100%;padding:13px;">▶ Start Workout</button>
    </div>`;
  }

  function render() {
    if (view === "history-months") { renderHistoryMonths(); return; }
    if (view === "history-month-detail") { renderHistoryMonthDetail(); return; }
    if (view === "history-detail") { renderHistoryDetail(); return; }
    if (view === "programs-list") { renderProgramsList(); return; }
    if (view === "charts-list") { renderChartsList(); return; }
    if (view === "chart-detail") { renderChartDetail(); return; }
    renderToday();
  }

  function renderToday() {
    const app = document.getElementById("app");
    const activeDayData = PROGRAM.find(d => d.key === activeDay);
    const trainingKeys = trainingDayKeys();
    const completedTrainingDays = trainingKeys.filter(k => {
      const c = dayCompletion(PROGRAM.find(d => d.key === k));
      return c.isComplete && c.total > 0;
    }).length;
    const activeProgramName = getActiveProgramEntry().name;
    const todaysKey = todayKey();

    const tabsHTML = PROGRAM.map(day => {
      const c = dayCompletion(day);
      const classes = ["day-tab"];
      if (day.key === activeDay) classes.push("active");
      if (day.key === todaysKey) classes.push("today");
      if (day.rest) classes.push("restday");
      else if (c.isComplete && c.total > 0) classes.push("complete");
      return `<button class="${classes.join(' ')}" data-day="${day.key}">
        <span>${day.short}</span><span class="dot"></span>
      </button>`;
    }).join("");

    const cardHTML = buildCardHTML(activeDayData);
    const suppHTML = buildSupplementsCard(activeDay);
    const timerHTML = buildTimerCard(activeDay);
    const toastHTML = toastMarkup();

    app.innerHTML = `
      <div class="header">
        <div class="header-text">
          <span class="eyebrow">${activeProgramName}</span>
          <span class="title">${activeDayData.label}</span>
        </div>
        <div class="header-actions">
          <button class="history-btn" id="open-charts-btn">Charts</button>
          <button class="history-btn" id="open-programs-btn">Programs</button>
          <button class="history-btn" id="open-history-btn">History</button>
        </div>
      </div>
      <div class="barbell-wrap">
        ${barbellSVG(completedTrainingDays, trainingKeys.length)}
        <div class="barbell-label"><span class="barbell-count">${completedTrainingDays}</span><span>/${trainingKeys.length} sessions loaded this week</span></div>
      </div>
      <div class="day-tabs">${tabsHTML}</div>
      ${timerHTML}
      ${cardHTML}
      ${suppHTML}
      <div class="footer-note">Progress resets automatically every Monday</div>
      ${toastHTML}
    `;

    document.getElementById("open-history-btn").addEventListener("click", () => {
      view = "history-months";
      render();
    });

    document.getElementById("open-programs-btn").addEventListener("click", () => {
      view = "programs-list";
      resetTransientState();
      render();
    });

    document.getElementById("open-charts-btn").addEventListener("click", () => {
      view = "charts-list";
      resetTransientState();
      render();
    });

    const timerStartBtn = app.querySelector("#timer-start-btn");
    if (timerStartBtn) {
      timerStartBtn.addEventListener("click", () => {
        startWorkoutSession(activeDay);
        render();
      });
    }

    const timerToggleBtn = app.querySelector("#timer-toggle-btn");
    if (timerToggleBtn) {
      timerToggleBtn.addEventListener("click", () => {
        toggleSessionMode();
        render();
      });
    }

    const timerStopBtn = app.querySelector("#timer-stop-btn");
    if (timerStopBtn) {
      timerStopBtn.addEventListener("click", () => {
        stopWorkoutSession();
        render();
      });
    }

    const timerDiscardBtn = app.querySelector("#timer-discard-btn");
    if (timerDiscardBtn) {
      timerDiscardBtn.addEventListener("click", () => {
        discardWorkoutSession();
        render();
      });
    }

    app.querySelectorAll("[data-clear-timer]").forEach(btn => {
      btn.addEventListener("click", () => {
        clearWorkoutTimer(btn.getAttribute("data-clear-timer"));
        render();
      });
    });

    const timerJumpBtn = app.querySelector("#timer-jump-btn");
    if (timerJumpBtn) {
      timerJumpBtn.addEventListener("click", () => {
        activeDay = activeSession.dayKey;
        resetTransientState();
        render();
      });
    }

    bindToastEvents(app);

    app.querySelectorAll(".day-tab").forEach(btn => {
      btn.addEventListener("click", () => {
        activeDay = btn.getAttribute("data-day");
        resetTransientState();
        render();
      });
    });

    app.querySelectorAll("[data-check-ex]").forEach(el => {
      el.addEventListener("click", () => {
        const exId = el.getAttribute("data-check-ex");
        const ex = (activeDayData.exercises || []).find(e => e.id === exId);
        const entry = getEntry(activeDay, exId, ex);
        setEntry(activeDay, exId, { done: !entry.done }, ex);
        render();
      });
    });

    app.querySelectorAll("[data-sets-ex]").forEach(el => {
      el.addEventListener("click", () => {
        const exId = el.getAttribute("data-sets-ex");
        const ex = (activeDayData.exercises || []).find(e => e.id === exId);
        const entry = getEntry(activeDay, exId, ex);
        const total = parseTotalSets(ex ? ex.target : entry.target);
        let next = entry.setsCompleted + 1;
        const patch = {};
        if (next > total) {
          next = 0;
        } else if (next === total) {
          patch.done = true;
        }
        patch.setsCompleted = next;
        setEntry(activeDay, exId, patch, ex);
        render();
      });
    });

    app.querySelectorAll("[data-expand-ex]").forEach(el => {
      el.addEventListener("click", () => {
        const exId = el.getAttribute("data-expand-ex");
        if (expandedSet.has(exId)) expandedSet.delete(exId);
        else expandedSet.add(exId);
        render();
      });
    });

    app.querySelectorAll("[data-weight-ex]").forEach(input => {
      input.addEventListener("change", () => {
        const exId = input.getAttribute("data-weight-ex");
        const ex = (activeDayData.exercises || []).find(e => e.id === exId);
        const entry = getEntry(activeDay, exId, ex);
        const patch = { weight: input.value };
        if (input.value.trim() && !entry.done) patch.done = true;
        setEntry(activeDay, exId, patch, ex);
        render();
      });
    });

    app.querySelectorAll("[data-reps-ex]").forEach(input => {
      input.addEventListener("change", () => {
        const exId = input.getAttribute("data-reps-ex");
        const ex = (activeDayData.exercises || []).find(e => e.id === exId);
        const entry = getEntry(activeDay, exId, ex);
        const patch = { reps: input.value };
        if (input.value.trim() && !entry.done) patch.done = true;
        setEntry(activeDay, exId, patch, ex);
        render();
      });
    });

    const editToggleBtn = app.querySelector("#edit-toggle-btn");
    if (editToggleBtn) {
      editToggleBtn.addEventListener("click", () => {
        editMode = !editMode;
        addFormOpen = false;
        expandedSet = new Set();
        groupSelectSet = new Set();
        render();
      });
    }

    app.querySelectorAll("[data-remove-ex]").forEach(btn => {
      btn.addEventListener("click", () => {
        removeExercise(activeDay, btn.getAttribute("data-remove-ex"));
        render();
      });
    });

    app.querySelectorAll("[data-rename-ex]").forEach(input => {
      input.addEventListener("change", () => {
        const exId = input.getAttribute("data-rename-ex");
        const field = input.getAttribute("data-field");
        const day = PROGRAM.find(d => d.key === activeDay);
        if (!day || !Array.isArray(day.exercises)) return;
        const ex = day.exercises.find(e => e.id === exId);
        if (!ex) return;
        const value = input.value.trim();
        if (field === "name" && !value) {
          input.value = ex.name;
          return;
        }
        ex[field] = value || (field === "target" ? "—" : ex[field]);
        saveProgram();
        render();
      });
    });

    app.querySelectorAll("[data-day-focus-input]").forEach(input => {
      input.addEventListener("change", () => {
        const dayKey = input.getAttribute("data-day-focus-input");
        const day = PROGRAM.find(d => d.key === dayKey);
        if (!day) return;
        const value = input.value.trim();
        if (!value) {
          input.value = day.focus;
          return;
        }
        day.focus = value;
        saveProgram();
        render();
      });
    });

    app.querySelectorAll("[data-group-select]").forEach(btn => {
      btn.addEventListener("click", () => {
        const exId = btn.getAttribute("data-group-select");
        if (groupSelectSet.has(exId)) groupSelectSet.delete(exId);
        else groupSelectSet.add(exId);
        render();
      });
    });

    app.querySelectorAll("[data-ungroup-ex]").forEach(btn => {
      btn.addEventListener("click", () => {
        removeFromSuperset(activeDay, btn.getAttribute("data-ungroup-ex"));
        render();
      });
    });

    const groupSelectedBtn = app.querySelector("#group-selected-btn");
    if (groupSelectedBtn) {
      groupSelectedBtn.addEventListener("click", () => {
        createSuperset(activeDay);
        render();
      });
    }

    app.querySelectorAll("[data-dropset-ex]").forEach(btn => {
      btn.addEventListener("click", () => {
        const exId = btn.getAttribute("data-dropset-ex");
        const day = PROGRAM.find(d => d.key === activeDay);
        if (!day || !Array.isArray(day.exercises)) return;
        const ex = day.exercises.find(e => e.id === exId);
        if (!ex) return;
        if (ex.dropSet) delete ex.dropSet;
        else ex.dropSet = true;
        saveProgram();
        render();
      });
    });

    const openAddBtn = app.querySelector("#open-add-ex");
    if (openAddBtn) {
      openAddBtn.addEventListener("click", () => {
        addFormOpen = true;
        render();
        const nameInput = document.getElementById("new-ex-name");
        if (nameInput) nameInput.focus();
      });
    }

  function attachDragHandlers(app) {
    if (!editMode) return;
    const container = app.querySelector("#exercise-rows");
    if (!container) return;
    const rowEls = Array.from(container.querySelectorAll(".exercise-row-wrap[data-ex-id]"));
    if (rowEls.length < 2) return;
    const rowHeight = rowEls[0].getBoundingClientRect().height;

    rowEls.forEach((rowEl, startIndex) => {
      const handle = rowEl.querySelector("[data-drag-ex]");
      if (!handle) return;

      handle.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        let hoverIndex = startIndex;
        const startY = e.clientY;
        rowEl.classList.add("dragging");
        rowEl.style.transition = "none";
        try { handle.setPointerCapture(e.pointerId); } catch (err) {}

        function onMove(ev) {
          const dy = ev.clientY - startY;
          rowEl.style.transform = `translateY(${dy}px)`;
          let newHover = startIndex + Math.round(dy / rowHeight);
          newHover = Math.max(0, Math.min(rowEls.length - 1, newHover));
          if (newHover !== hoverIndex) {
            hoverIndex = newHover;
            rowEls.forEach((el, i) => {
              if (i === startIndex) return;
              let shift = 0;
              if (i > startIndex && i <= hoverIndex) shift = -rowHeight;
              else if (i < startIndex && i >= hoverIndex) shift = rowHeight;
              el.style.transform = shift ? `translateY(${shift}px)` : "";
            });
          }
        }

        function onUp() {
          handle.removeEventListener("pointermove", onMove);
          handle.removeEventListener("pointerup", onUp);
          handle.removeEventListener("pointercancel", onUp);
          try { handle.releasePointerCapture(e.pointerId); } catch (err) {}

          if (hoverIndex !== startIndex) {
            const dayObj = PROGRAM.find(d => d.key === activeDay);
            if (dayObj && Array.isArray(dayObj.exercises)) {
              const list = dayObj.exercises;
              const [moved] = list.splice(startIndex, 1);
              list.splice(hoverIndex, 0, moved);
              saveProgram();
            }
          }
          render();
        }

        handle.addEventListener("pointermove", onMove);
        handle.addEventListener("pointerup", onUp);
        handle.addEventListener("pointercancel", onUp);
      });
    });
  }

        return `<div class="history-ex-row">
          <span class="history-ex-name">${e.name || "Exercise"}</span>
          <span class="history-ex-log">${logBits}${isPR ? ' <span class="pr-badge">🏆 PR</span>' : ''}</span>
        </div>`;
      }).join("");
      return `<div class="history-day">
        <div class="history-day-label">${dayLabel}</div>
        ${rows}
        ${suppHTML}
        ${timerHTML}
      </div>`;
    }).join("");

    app.innerHTML = `
      <div class="header">
        <div class="header-text">
          <span class="eyebrow">Home Gym — History</span>
          <span class="title">${formatWeekRange(historyWeekKey)}</span>
        </div>
        <button class="history-btn" id="back-to-month-detail-btn">← Weeks</button>
      </div>
      ${weekStatsHTML}
      <div class="history-detail">${daysHTML}</div>
    `;

    document.getElementById("back-to-month-detail-btn").addEventListener("click", () => {
      historyMonthKey = historyWeekKey.slice(0, 7);
      view = "history-month-detail";
      render();
    });
  }

  // Check for week rollover periodically (e.g. app left open past midnight Sun->Mon)
  setInterval(() => {
    const currentKey = getWeekKey();
    if (currentKey !== weekKey) {
      weekKey = currentKey;
      activeDay = todayKey();
      progress = loadProgress(weekKey);
      view = "today";
      resetTransientState();
      render();
    }
  }, 60000);

  // Live-update the workout timer display without a full re-render
  setInterval(tickTimerDisplay, 1000);

  render();
</script>
</body>
</html>
